<script>
(function(){
const $ = s => document.querySelector(s);
const main = $("#main"), nav = $("#nav");
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let learned = store.get("gspb_learned") || {};
const byId = Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const TABS = [["uebersicht","Übersicht"],...TOPICS.map(t=>[t.id,t.tab]),["zeitleiste","Zeitleiste"],["begriffe","Begriffe"],["karten","Karteikarten"],["quiz","Quiz"],["zusammenhaenge","Zusammenhänge"]];
const TABCOL={uebersicht:"#1d4e89",zeitleiste:"#455a64",begriffe:"#00796b",karten:"#ad1457",quiz:"#e65100",zusammenhaenge:"#4527a0"};
TOPICS.forEach(t=>TABCOL[t.id]=t.color);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const legend = '<div class="legend"><span><mark>markiert</mark> = sehr wichtig</span><span><span class="zi" style="padding:0 4px">grau</span> = Zusatzinfo (nicht aus dem Unterricht)</span><span><span class="note">gelb kursiv</span> = Abweichung im Arbeitsblatt/der Präsentation</span></div>';

function renderNav(cur){
  nav.innerHTML = TABS.map(([id,label])=>`<button data-t="${id}" style="--c:${TABCOL[id]}" class="${id===cur?'active':''}">${esc(label)}${learned[id]?'<span class="chk">✓</span>':''}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.t));
  const n = TOPICS.filter(t=>learned[t.id]).length;
  $("#progress div").style.width = (100*n/TOPICS.length)+"%";
  const a = nav.querySelector(".active"); if(a && a.scrollIntoView) a.scrollIntoView({block:"nearest",inline:"nearest"});
}
function go(id){ if(location.hash!=="#"+id) location.hash=id; else show(id); }
function show(id){
  if(!TABS.some(t=>t[0]===id)) id="uebersicht";
  renderNav(id);
  main.style.setProperty("--tc",TABCOL[id]);
  if(id==="uebersicht") ov(); else if(byId[id]) topic(byId[id]);
  else ({zeitleiste:tl,begriffe:gl,karten:fc,quiz:qz,zusammenhaenge:zh})[id]();
  window.scrollTo(0,0);
}


const subPos={}, seen={};
function subtabs(key,secs,intro,after){
  if(subPos[key]==null) subPos[key]=0;
  const i=Math.min(subPos[key],secs.length-1); seen[key]=seen[key]||{}; seen[key][i]=true;
  const pv=secs[i-1], nx=secs[i+1];
  main.innerHTML = intro + `<div class="subnav" id="sn">${secs.map((x,j)=>`<button data-i="${j}" class="${j===i?'on':''} ${seen[key][j]?'seen':''}"><span class="n">${j+1}</span>${esc(x.l)}</button>`).join("")}</div>
  <div class="bar"><div style="width:${100*(i+1)/secs.length}%"></div></div><p class="stepinfo">Teil ${i+1} von ${secs.length}</p>
  <div class="sec-card">${secs[i].h}</div>
  <div class="pager">${pv?`<button class="pv"><small>← zurück</small>${esc(pv.l)}</button>`:''}${nx?`<button class="nx"><small>weiter →</small>${esc(nx.l)}</button>`:''}</div>`;
  const set=j=>{subPos[key]=j;subtabs(key,secs,intro,after);document.querySelector("header").scrollIntoView();window.scrollTo(0,0)};
  main.querySelectorAll("#sn button").forEach(b=>b.onclick=()=>set(+b.dataset.i));
  const on=main.querySelector("#sn .on"); if(on){const sn=main.querySelector("#sn");sn.scrollLeft=on.offsetLeft-sn.offsetLeft-40;}
  const p=main.querySelector(".pager .pv"), n=main.querySelector(".pager .nx");
  if(p) p.onclick=()=>set(i-1); if(n) n.onclick=()=>set(i+1);
  if(after) after();
  return i;
}
function ov(){
  const n = TOPICS.filter(t=>learned[t.id]).length;
  const secs=[
   {l:"Themen",h:`<h3>Die 7 Themen</h3><p class="small">Test am <b>17.11.2026</b>. Fortschritt: <b>${n} von ${TOPICS.length}</b> Themen gelernt. Tippe auf ein Thema, um es zu öffnen.</p>`+TOPICS.map((t,i)=>`<div class="card ov-topic" data-t="${t.id}" style="border-left:6px solid ${t.color}"><b style="color:${t.color}">${i+1}. ${esc(t.title)}</b> ${learned[t.id]?'<span class="badge-ok">✓ gelernt</span>':''}<br><span class="small" style="color:var(--ink)">${t.ueberblick}</span></div>`).join("")},
   {l:"Das Wichtigste in 5 Punkten",h:`<h3>Das Wichtigste in 5 Punkten</h3><ol>${TOP5.map(x=>`<li style="margin:8px 0">${x}</li>`).join("")}</ol>`},
   {l:"So lernst du",h:`<h3>So nutzt du die Seite</h3><ol><li>Öffne ein Thema und klicke dich mit <b>„weiter →“</b> Teil für Teil durch.</li><li><mark>Gelb markiert</mark> = sehr wichtig für den Test.</li><li>Beantworte die <b>Prüfungsfragen</b> zuerst selbst, dann Modellantwort öffnen.</li><li>Markiere das Thema als <b>„Gelernt“</b>.</li><li>Wiederhole mit <b>Karteikarten</b> und <b>Quiz</b>.</li></ol>${legend}`}];
  subtabs("ov",secs,`<h2>Übersicht</h2>`,()=>main.querySelectorAll(".ov-topic").forEach(c=>c.onclick=()=>go(c.dataset.t)));
}

function topic(t){
  const parts=t.body.split(/(?=<h3)/);
  let pre=parts[0].includes("<h3")?"":parts.shift();
  const secs=[{l:"Start",h:`<h3>Worum geht es?</h3>${legend}<div class="kern"><b>Kernaussage:</b> ${t.kern}</div>${pre}<h3>Ursachen · Verlauf · Folgen</h3><div class="scroll"><table>${t.ursachen.map(r=>`<tr><th style="width:110px">${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</table></div>`}];
  parts.forEach(p=>{const m=p.match(/<h3[^>]*data-s="([^"]+)"/);secs.push({l:m?m[1]:"Teil",h:p.replace(/(<h3[^>]*>)\s*[0-9A-Z]{1,2}[a-c]?\.\s*/,"$1")});});
  secs.push({l:"Personen, Daten, Begriffe",h:`<h3>Wichtige Personen, Daten, Begriffe</h3><div class="scroll"><table><tr><th>Art</th><th>Name / Datum / Begriff</th><th>Bedeutung</th></tr>${t.personen.map(r=>`<tr><td class="small">${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td></tr>`).join("")}</table></div>`});
  secs.push({l:"★ Merke dir",h:`<div class="merke"><h3>Merke dir</h3><ul>${t.merke.map(m=>`<li>${m}</li>`).join("")}</ul></div>`});
  secs.push({l:"Prüfungsfragen",h:`<h3>Mögliche Prüfungsfragen</h3><p class="small">Erst selbst antworten, dann auf die Frage tippen.</p>
  ${t.fragen.map(f=>`<details class="q"><summary><span class="op">${f.op}</span>${f.q}</summary><div class="ans"><b>Modellantwort:</b> ${f.a}</div></details>`).join("")}
  <p style="margin-top:16px"><button class="btn ${learned[t.id]?'done':''}" id="lb">${learned[t.id]?'✓ Gelernt (zum Zurücksetzen tippen)':'Als „Gelernt“ markieren'}</button></p>
  <p><button class="btn sec" id="toq">Quiz zu diesem Thema</button> <button class="btn sec" id="tok">Karteikarten</button></p>`});
  subtabs(t.id,secs,`<h2>${esc(t.title)} ${learned[t.id]?'<span class="badge-ok">✓</span>':''}</h2>`,()=>{
    const lb=main.querySelector("#lb"); if(!lb) return;
    lb.onclick=()=>{learned[t.id]=!learned[t.id];store.set("gspb_learned",learned);topic(t);renderNav(t.id)};
    $("#toq").onclick=()=>{qState={topic:t.id};go("quiz")};
    $("#tok").onclick=()=>{fcState={topic:t.id,i:0,order:null};go("karten")};
  });
}

let tlFilter="alle";
function tl(){
  const f = tlFilter;
  main.innerHTML = `<h2>Zeitleiste</h2><div class="toolbar">${[["alle","Alle"],...TOPICS.map(t=>[t.id,t.tab])].map(([id,l])=>`<button class="btn ${f===id?'on':''}" data-f="${id}">${esc(l)}</button>`).join("")}</div>
  <div class="tl">${TIMELINE.filter(e=>f==="alle"||e[2]===f).map(e=>{const t=byId[e[2]];return `<div class="ev" style="--c:${t.color}"><span class="d">${e[0]}</span><span class="tag" style="--c:${t.color}">${esc(t.tab)}</span><br>${e[1]}</div>`}).join("")}</div>`;
  main.querySelectorAll(".toolbar .btn").forEach(b=>b.onclick=()=>{tlFilter=b.dataset.f;tl()});
}

let glLetter="";
function gl(){
  const list = GLOSSAR.slice().sort((a,b)=>a[0].localeCompare(b[0],"de"));
  const letters=[...new Set(list.map(g=>g[0][0].toUpperCase()))];
  main.innerHTML = `<h2>Begriffe (A–Z)</h2><input type="search" id="gs" placeholder="Begriff suchen …" aria-label="Begriff suchen"><div class="letters"><button data-l="" class="${glLetter?'':'on'}">Alle</button>${letters.map(l=>`<button data-l="${l}" class="${glLetter===l?'on':''}">${l}</button>`).join("")}</div><p class="small" id="gc"></p><dl class="gl" id="gll"></dl>`;
  const r = ()=>{const q=$("#gs").value.trim().toLowerCase();const m=list.filter(g=>(!q||(g[0]+" "+g[1]).toLowerCase().includes(q))&&(q||!glLetter||g[0][0].toUpperCase()===glLetter));
    $("#gll").innerHTML=m.map(g=>`<dt>${esc(g[0])}</dt><dd>${esc(g[1])}</dd>`).join("");$("#gc").textContent=m.length+" von "+list.length+" Begriffen";};
  $("#gs").oninput=r; main.querySelectorAll(".letters button").forEach(b=>b.onclick=()=>{glLetter=b.dataset.l;gl()}); r();
}

let fcState={topic:"alle",i:0,order:null};
function fcCards(){return TOPICS.filter(t=>fcState.topic==="alle"||t.id===fcState.topic).flatMap(t=>t.karten.map(k=>({q:k[0],a:k[1],t})))}
function fc(){
  let cards=fcCards(); if(fcState.order) cards=fcState.order.map(i=>cards[i]).filter(Boolean);
  if(fcState.i>=cards.length) fcState.i=0;
  const c=cards[fcState.i];
  main.innerHTML = `<h2>Karteikarten</h2><div class="toolbar">${[["alle","Alle"],...TOPICS.map(t=>[t.id,t.tab])].map(([id,l])=>`<button class="btn ${fcState.topic===id?'on':''}" data-f="${id}">${esc(l)}</button>`).join("")}</div>
  <div class="fc-wrap"><div class="fc" id="card"><div class="face front"><div><div class="small" style="margin-bottom:8px"><span class="tag" style="--c:${c.t.color}">${esc(c.t.tab)}</span></div>${esc(c.q)}<div class="small" style="margin-top:12px">Tippen zum Umdrehen</div></div></div><div class="face back"><div>${esc(c.a)}</div></div></div></div>
  <div class="fc-nav"><button class="btn sec" id="pv">← Zurück</button><span class="small">${fcState.i+1} / ${cards.length}</span><button class="btn sec" id="nx">Weiter →</button></div>
  <p style="text-align:center"><button class="btn sec" id="sh">Mischen</button></p>`;
  $("#card").onclick=()=>$("#card").classList.toggle("flip");
  $("#pv").onclick=()=>{fcState.i=(fcState.i-1+cards.length)%cards.length;fc()};
  $("#nx").onclick=()=>{fcState.i=(fcState.i+1)%cards.length;fc()};
  $("#sh").onclick=()=>{fcState.order=shuffle([...Array(fcCards().length).keys()]);fcState.i=0;fc()};
  main.querySelectorAll(".toolbar .btn").forEach(b=>b.onclick=()=>{fcState={topic:b.dataset.f,i:0,order:null};fc()});
}

let qState={topic:null};
function qz(){
  if(!qState.run){ return qStart(qState.topic); }
  const R=qState.run;
  if(R.i>=R.qs.length){
    const p=Math.round(100*R.score/R.qs.length);
    main.innerHTML=`<h2>Quiz: Ergebnis</h2><div class="card" style="text-align:center"><div style="font-size:2rem;font-weight:700">${R.score} / ${R.qs.length}</div><div>${p} % richtig · ${p>=90?'Ausgezeichnet!':p>=70?'Gut gemacht!':p>=50?'Nicht schlecht, wiederhole die Fehler.':'Lies die Themen noch einmal.'}</div></div>
    ${R.wrong.length?`<h3>Das solltest du wiederholen</h3>${R.wrong.map(w=>`<div class="card"><b>${esc(w.q)}</b><br>Richtig: ${esc(w.o[w.r])}<br><span class="small">${esc(w.e)}</span></div>`).join("")}`:""}
    <p><button class="btn" id="again">Neues Quiz</button></p>`;
    $("#again").onclick=()=>{qState={topic:R.topic};qz()}; return;
  }
  const q=R.qs[R.i];
  main.innerHTML=`<h2>Quiz: ${R.topic==="mix"?"Gemischt":esc(byId[R.topic].tab)}</h2><p class="small">Frage ${R.i+1} von ${R.qs.length} · Punkte: ${R.score}</p>
  <div class="card"><b>${esc(q.q)}</b><div id="opts">${q.order.map(oi=>`<button class="qopt" data-o="${oi}">${esc(q.o[oi])}</button>`).join("")}</div><div id="exp"></div></div>`;
  main.querySelectorAll(".qopt").forEach(b=>b.onclick=()=>{
    if(q.done) return; q.done=true; const o=+b.dataset.o; const ok=o===q.r;
    if(ok) R.score++; else R.wrong.push(q);
    main.querySelectorAll(".qopt").forEach(x=>{const xo=+x.dataset.o; if(xo===q.r) x.classList.add("right"); else if(xo===o) x.classList.add("wrong");});
    $("#exp").innerHTML=`<div class="qexp"><b>${ok?"Richtig!":"Leider falsch."}</b> ${esc(q.e)}</div><p><button class="btn" id="nq">${R.i+1<R.qs.length?"Nächste Frage →":"Ergebnis anzeigen"}</button></p>`;
    $("#nq").onclick=()=>{R.i++;qz()};
  });
}
function qStart(sel){
  main.innerHTML=`<h2>Quiz</h2><p>Wähle ein Thema oder ein gemischtes Quiz (15 Fragen aus allen Themen).</p><div class="toolbar">${TOPICS.map(t=>`<button class="btn" data-q="${t.id}" style="background:#fff;color:${t.color};border-color:${t.color}">${esc(t.tab)} (${t.quiz.length})</button>`).join("")}<button class="btn on" data-q="mix">Gemischt (15)</button></div>`;
  const start=id=>{const pool=id==="mix"?shuffle(TOPICS.flatMap(t=>t.quiz)).slice(0,15):shuffle(byId[id].quiz);
    qState.run={topic:id,i:0,score:0,wrong:[],qs:pool.map(x=>({q:x[0],o:x[1],r:x[2],e:x[3],order:shuffle([...x[1].keys()])}))};qz();};
  main.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>start(b.dataset.q));
  if(sel){qState.topic=null;start(sel);}
}

function zh(){
  const lab={u:["r-u","Ursache → Folge"],f:["r-f","Folge"],k:["r-k","Kontinuität"],b:["r-b","Bruch"]};
  main.innerHTML=`<h2>Zusammenhänge</h2><p class="small">Wie hängen die Themen zusammen? <span class="rel r-u">Ursache → Folge</span><span class="rel r-f">Folge</span><span class="rel r-k">Kontinuität</span><span class="rel r-b">Bruch</span></p>
  <div class="card"><b>Die große Linie:</b><div class="flow" style="margin-top:6px">${["Aufklärung","USA 1776/87","Frz. Revolution 1789","Napoleon 1799–1815","Wiener Kongress 1815","Vormärz 1815–1848","Revolutionen 1848"].map((x,i,a)=>`<div class="box" style="flex:1 1 110px;text-align:center"><b>${x}</b></div>${i<a.length-1?'<div class="arrow">→</div>':''}`).join("")}</div>
  <p class="small">Parallel: Industrielle Revolution (Großbürgertum, Proletariat) stärkt Liberalismus und Nationalismus.</p></div>
  <div class="zus-grid">${ZUSAMMENHAENGE.map(z=>`<div class="card"><span class="rel ${lab[z[0]][0]}">${lab[z[0]][1]}</span><br><b>${esc(z[1])}</b><br>${esc(z[2])}</div>`).join("")}</div>`;
}

window.addEventListener("hashchange",()=>{qState.run=null;show(location.hash.slice(1))});
show(location.hash.slice(1)||"uebersicht");
})();

</script>
