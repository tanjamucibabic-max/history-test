<header>

const TOPICS = [];
TOPICS.push({
id:"usa", tab:"USA", color:"#1565c0",
title:"USA: Unabhängigkeit, Verfassung und politisches System",
ueberblick:"Die 13 britischen Kolonien in Nordamerika wehren sich gegen Steuern ohne Mitsprache („No taxation without representation“) und erklären am 4. Juli 1776 ihre Unabhängigkeit. Die Verfassung von 1787 und die Bill of Rights (1791) setzen Ideen der Aufklärung um und werden Vorbild für Frankreich und viele Demokratien. Das US-System ist eine präsidentielle Demokratie mit starker Gewaltentrennung.",
kern:"Die USA sind der erste Staat, in dem die Ideen der Aufklärung (Volkssouveränität, Menschenrechte, Gewaltenteilung) in einer Verfassung umgesetzt werden. Das macht sie zum Vorbild für die Französische Revolution.",
body:`
<h3 data-s="7-jähriger Krieg">1. Vorgeschichte: Der Siebenjährige Krieg (1756–1763)</h3>
<ul>
<li>Erster <b>global geführter Konflikt</b>, auch zwischen <b>England und Frankreich</b>. Kriegsschauplätze: <b>Europa, Indien, Nordamerika</b>.</li>
<li><b>Ergebnis:</b> England siegt. Frankreich verliert den Großteil seiner Kolonien in Nordamerika und Indien.</li>
<li><b>Folgen:</b> Beide Staaten haben hohe <b>Kriegsschulden</b>. England will sie über Steuern in den Kolonien bezahlen lassen. Frankreich unterstützt später (unter <b>Ludwig XVI.</b>) die Amerikaner militärisch im Unabhängigkeitskrieg (<mark>1775–1783</mark>), aus Rache an England.</li>
<li><b>Marquis de La Fayette</b> kämpft als Freiwilliger auf der Seite der Amerikaner und wird US-Kriegsheld. Später ist er Kommandeur der <b>Nationalgarde</b> der Französischen Revolution.</li>
<li>Spuren der französischen Kolonialzeit in den USA: <b>St. Louis, Louisiana</b> (nach Ludwig XIV.), <b>New Orleans, Baton Rouge</b>, <b>Mardi Gras</b>.</li>
</ul>
<h3 data-s="Weg zur Unabhängigkeit">2. Der Weg zur Unabhängigkeit</h3>
<ul>
<li>An der Ostküste Nordamerikas entstehen bis 1756 insgesamt <b><mark>13 britische Kolonien</mark></b>. Sie fordern von London mehr Eigenständigkeit.</li>
<li>Nach dem gewonnenen Kolonialkrieg gegen Frankreich erhöhen die Briten <b>Steuern und Zölle</b> (Zucker, Tee, Wein usw.) drastisch, um die Kriegskosten zu refinanzieren. Es folgen Streiks und Proteste.</li>
<li><b><mark>„No taxation without representation“</mark></b>: Die Amerikaner sind empört, Steuern zu zahlen, obwohl sie im <b>britischen Parlament nicht vertreten</b> sind.</li>
<li>Die Briten nehmen alle Steuern zurück, <b>außer der Teesteuer</b>. Sie geben also in der Sache nach, aber <b>nicht im Prinzip</b>. Genau um dieses Prinzip ging es vielen Siedlern.</li>
<li><b>Boston Tea Party</b> (16. Dezember 1773): Als Indianer verkleidete Amerikaner werfen eine Ladung britischen Tees in den Hafen von Boston. <span class="note">(im Arbeitsblatt steht der Satz „1775 eskalierte die Situation“ direkt davor; die Tea Party selbst war 1773, der Krieg begann 1775)</span>
<ul><li>= <b>unwiderruflicher Akt</b>, bewusst um einen Krieg auszulösen.</li>
<li>Warum Indianerverkleidung? Der Indianer ist ein Symbol für <b>Amerika und Freiheit</b>.</li></ul></li>
<li><b>Unabhängigkeitskrieg 1775–1783</b>. Erfolgreicher General: <b>George Washington</b>.</li>
</ul>
<h3 data-s="Unabhängigkeitserklärung">3. Die Unabhängigkeitserklärung (4. Juli 1776)</h3>
<ul>
<li>Die Abgeordneten aller <b>13 Kolonien</b> unterzeichnen die von <b><mark>Thomas Jefferson</mark></b> verfasste <b>Declaration of Independence</b>. Sie ist die <b>Gründungsurkunde der USA</b>.</li>
<li>Der <b>4. Juli</b> ist seither der <b>Unabhängigkeitstag</b> (Nationalfeiertag).</li>
<li><b>Benjamin Franklin</b> (Verleger, Erfinder, Diplomat) arbeitet an der Unabhängigkeitserklärung und an der Verfassung mit.</li>
</ul>
<h4>Grundrechte in der Unabhängigkeitserklärung</h4>
<ul>
<li>Alle Menschen sind <b>gleich erschaffen</b>.</li>
<li><b>Unveräußerliche Rechte</b>: <b><mark>Leben, Freiheit und das Streben nach Glück</mark></b> („pursuit of happiness“).</li>
</ul>
<h4>Aufklärerische Gedanken darin</h4>
<ul>
<li><b>Naturrecht</b>: Rechte kommen von der Natur bzw. vom Schöpfer, nicht vom König.</li>
<li><b>Volkssouveränität / Gesellschaftsvertrag</b>: Regierungen haben ihre Macht von der <b><mark>Zustimmung der Regierten</mark></b>.</li>
<li><b>Widerstandsrecht</b>: Wenn eine Regierung diese Rechte zerstört, hat das Volk das Recht (ja die Pflicht), sie zu ändern oder abzuschaffen.</li>
<li>Vorwurf an den König von Großbritannien: Er wolle eine <b>„absolute Tyrannei“</b> errichten.</li>
</ul>
<h3 data-s="Verfassung">4. Die US-Verfassung („We the people …“)</h3>
<ul>
<li>Beschlossen <b>1787</b> von der verfassungsgebenden Versammlung in <b>Philadelphia</b>, in Kraft am <b><mark>4. März 1789</mark></b>. Sie ist das oberste Gesetz der USA.</li>
<li>Sie gilt als die <b>älteste (noch gültige) Verfassung</b>, weil sie in ihren Grundprinzipien bis heute den Bestimmungen aus dem <b>18. Jh.</b> entspricht. Modell für viele andere <b>demokratische</b> Verfassungen.</li>
<li><span class="note">(im Arbeitsblatt: „von den dreizehn ehemaligen Kolonien entworfen“; genau genommen schickten 12 Staaten Delegierte, Rhode Island blieb fern)</span></li>
</ul>
<h4>Präambel 1787: Schlüsselbegriffe und Prinzipien</h4>
<table><tr><th>Englisch</th><th>Bedeutung</th><th>Prinzip</th></tr>
<tr><td>We the People</td><td>Wir, das Volk</td><td>Volkssouveränität</td></tr>
<tr><td>a more perfect Union</td><td>eine vollkommenere Union</td><td>Einheit / Bundesstaat</td></tr>
<tr><td>establish Justice</td><td>Gerechtigkeit schaffen</td><td>Rechtsstaat</td></tr>
<tr><td>insure domestic Tranquility</td><td>Ruhe im Inneren sichern</td><td>innere Sicherheit</td></tr>
<tr><td>provide for the common defence</td><td>gemeinsame Verteidigung</td><td>äußere Sicherheit</td></tr>
<tr><td>promote the general Welfare</td><td>allgemeines Wohl fördern</td><td>Gemeinwohl</td></tr>
<tr><td>secure the Blessings of Liberty</td><td>Freiheit sichern, auch für die Nachkommen</td><td>Freiheit</td></tr></table>
<h3 data-s="Bill of Rights">5. Bill of Rights (1791)</h3>
<p><b><mark>10 Zusatzartikel</mark></b> zur Verfassung mit <b>unveräußerlichen Bürgerrechten</b>, z.B. <b>Religions-, Versammlungs-, Presse- und Redefreiheit</b>, aber auch das <b>Recht, Waffen zu tragen</b> (heute sehr umstritten).</p>
<div class="scroll"><table><tr><th>Art.</th><th>Inhalt (kurz)</th><th>Ein Begriff</th></tr>
<tr><td>1</td><td>Kein Gesetz über eine Staatsreligion; freie Religionsausübung, Rede-, Pressefreiheit, Versammlungsrecht, Petitionsrecht</td><td>Meinungs- und Religionsfreiheit</td></tr>
<tr><td>2</td><td>Recht, Waffen zu besitzen und zu tragen (Miliz)</td><td>Waffenrecht</td></tr>
<tr><td>3</td><td>Keine Einquartierung von Soldaten ohne Zustimmung des Eigentümers</td><td>Schutz des Hauses</td></tr>
<tr><td>4</td><td>Schutz vor ungerechtfertigter Durchsuchung und Beschlagnahme; Durchsuchungsbefehl nur mit Grund</td><td>Schutz der Privatsphäre</td></tr>
<tr><td>5</td><td>Anklage durch Geschworene; nicht zweimal für dieselbe Tat; man muss nicht gegen sich selbst aussagen; Eigentum nur gegen Entschädigung</td><td>Rechtsschutz / Eigentumsschutz</td></tr>
<tr><td>6</td><td>Schnelles, öffentliches Verfahren vor unparteiischen Geschworenen; Recht auf Verteidiger und Zeugen</td><td>faires Verfahren</td></tr>
<tr><td>7</td><td>Geschworenenverfahren auch in Zivilsachen (über 20 Dollar)</td><td>Geschworenengericht</td></tr>
<tr><td>8</td><td>Keine übermäßigen Kautionen, Geldstrafen, keine grausamen Strafen</td><td>Verbot grausamer Strafen</td></tr>
<tr><td>9</td><td>Aufgezählte Rechte schränken andere Rechte des Volkes nicht ein</td><td>weitere Rechte bleiben</td></tr>
<tr><td>10</td><td>Was der Bund nicht hat, bleibt bei den Einzelstaaten oder beim Volk</td><td>Föderalismus</td></tr></table></div>
<p><b>„Schutz vor Willkür“</b> bedeutet: Der Staat darf niemanden ohne Gesetz, ohne Grund und ohne faires Gerichtsverfahren verhaften, durchsuchen, bestrafen oder enteignen (Art. 4–8).</p>
<h3 data-s="Personen & Flagge">6. Wichtige Personen und Symbole</h3>
<ul>
<li><b>George Washington</b>: General im Unabhängigkeitskrieg, <b><mark>1. Präsident 1789–1797</mark></b>, auf der 1-Dollar-Note.</li>
<li><b>Thomas Jefferson</b>: Hauptverfasser der Unabhängigkeitserklärung.</li>
<li><b>Benjamin Franklin</b>: Verleger, Erfinder, Diplomat.</li>
<li><b>Freiheitsstatue</b>: Geschenk Frankreichs, <b>1886</b>.</li>
</ul>
<h4>Die US-Flagge</h4>
<div class="zusatz">Die <b>13 Streifen</b> stehen für die 13 Gründungskolonien. Die <b>Sterne</b> stehen für die Bundesstaaten: Anfangs 13 Sterne, mit jedem neuen Staat kam ein Stern dazu (Ausdehnung nach Westen, siehe historische Karte). Heute <b>50 Sterne</b> (seit 1960, mit Hawaii).</div>
<h3 data-s="Auswirkungen">7. Auswirkungen der US-Unabhängigkeit</h3>
<ul>
<li><b><mark>Inspiration für die Französische Revolution</mark></b> (Vorbild eines Staates, der nicht absolut regiert wird).</li>
<li><b>Vorbild für alle demokratischen Staaten</b>.</li>
<li><b>Unabhängigkeitskampf in Lateinamerika</b> (19. Jh.), Freiheitsheld <b>Simón Bolívar</b> (1783–1830). Er beginnt während der napoleonischen Kriege, als Spanien von Frankreich besetzt war: Unabhängigkeit von Spanien bzw. Portugal (Brasilien).</li>
<li>Wappen von <b>Kuba</b> und <b>Argentinien</b> zeigen die rote Freiheitsmütze der Französischen Revolution: Die Ideen wandern von Amerika nach Frankreich und wieder zurück nach Amerika.</li>
<li><b>Monroe-Doktrin</b>: „<b><mark>Amerika den Amerikanern</mark></b>“ (5. US-Präsident James Monroe, 1817–1825). Die USA unterstützen die Unabhängigkeit Lateinamerikas. Seither „Dollarimperialismus“: Lateinamerika gilt als <b>„Hinterhof der USA“</b>. <span class="zi">verkündet 1823; Europa soll sich nicht in Amerika einmischen</span></li>
</ul>
<h3 data-s="Wahlrecht: Großvaterklausel">8. Das US-Wahlrecht: einst und heute</h3>
<p><b>Großvaterklausel:</b> In mehreren Südstaaten wurde eine <b>„poll tax“</b> (Steuer, um wählen zu dürfen) eingeführt. Ausgenommen waren Bürger, deren <b>Väter und Großväter schon wahlberechtigt</b> waren. Das richtete sich vor allem gegen <b><mark>Afroamerikaner</mark></b> (ehemalige Sklaven, deren Großväter nie wählen durften) und arme Weiße. <span class="note">(in der Präsentation: „ab 1880“; historisch: Kopfsteuern ab den 1870er/1880er Jahren, die Großvaterklauseln selbst erst ab 1898, 1915 vom Obersten Gerichtshof verboten)</span> 1964 wurde diese Form der mittelbaren Diskriminierung im <b>24. Zusatzartikel</b> verboten (Bürgerrechtsbewegung, <b>Martin Luther King</b>).</p>
<p><b>Warum wird immer am Dienstag gewählt?</b> (FAZ-Artikel) Das Wahlgesetz stammt aus einer Zeit, in der Amerika von der <b>Landwirtschaft</b> geprägt war und es keine Autos gab. Montag ging nicht (Anreise am Sonntag = Kirchgang), Mittwoch war oft Markttag. <b>November</b>, weil die Ernte vorbei und das Wetter noch mild war. Nicht am 1. November (Allerheiligen, Buchführung der Kaufleute). Regel: <b>Dienstag nach dem ersten Montag im November</b>.</p>
<h3 data-s="Wahlrecht: Ausweitung">8b. Ausweitung des Wahlrechts</h3>
<div class="zusatz"><b>Wer durfte bei den ersten Präsidentenwahlen (1788/89) wählen?</b> Nur <b>weiße Männer mit Besitz</b> (Grund oder Steuerleistung), je nach Bundesstaat verschieden. <b>Nicht</b> wählen durften: Frauen, Sklaven, meist auch freie Afroamerikaner, Native Americans (Indianer) und arme Männer.
<div class="scroll"><table><tr><th>Jahr</th><th>Ausweitung des Wahlrechts</th><th>Zusammenhang mit der US-Geschichte</th></tr>
<tr><td>bis ca. 1850</td><td>Besitzklauseln fallen weg: alle weißen Männer dürfen wählen</td><td>Demokratisierung, Ausdehnung nach Westen</td></tr>
<tr><td>1865</td><td>13. Zusatzartikel: Sklaverei abgeschafft</td><td>Ende des Bürgerkriegs (1861–1865)</td></tr>
<tr><td>1870</td><td>15. Zusatzartikel: Wahlrecht unabhängig von Hautfarbe (für Männer)</td><td>nach dem Bürgerkrieg; im Süden mit poll tax, Lesetests und Großvaterklausel umgangen</td></tr>
<tr><td>1920</td><td>19. Zusatzartikel: Frauenwahlrecht</td><td>Frauenbewegung, Erster Weltkrieg</td></tr>
<tr><td>1924</td><td>Native Americans werden Staatsbürger</td><td>Indian Citizenship Act</td></tr>
<tr><td>1964</td><td>24. Zusatzartikel: keine Wahlsteuer (poll tax) bei Bundeswahlen</td><td>Bürgerrechtsbewegung (M. L. King)</td></tr>
<tr><td>1965</td><td>Voting Rights Act: Lesetests verboten, Schutz schwarzer Wähler</td><td>Bürgerrechtsbewegung</td></tr>
<tr><td>1971</td><td>26. Zusatzartikel: Wahlalter 18 statt 21</td><td>Vietnamkrieg („alt genug zum Kämpfen, alt genug zum Wählen“)</td></tr></table></div></div>
<h3 data-s="Politisches System">9. Das politische System der USA (präsidentielle Demokratie)</h3>
<div class="flow">
<div class="box"><b class="t">Kongress (Legislative)</b>= <b><mark>Repräsentantenhaus + Senat</mark></b><br><b>Repräsentantenhaus:</b> auf <b>2 Jahre</b> gewählt; Anzahl der Abgeordneten hängt von der <b>Bevölkerungszahl</b> des Staates ab <span class="zi">435 Sitze</span><br><b>Senat:</b> <b><mark>2 Senatoren</mark></b> pro Bundesstaat, auf <b>6 Jahre</b> gewählt</div>
<div class="box"><b class="t">Präsident (Exekutive)</b>Gewählt durch <b>Wahlmänner</b> auf <b>4 Jahre</b>, maximal <b>2 Amtsperioden</b>.<br>Aufgaben: <b>Staatsoberhaupt, Regierungschef, Oberbefehl über die Streitkräfte, Chef der Bundesbürokratie</b></div>
<div class="box"><b class="t">Gerichte (Judikative)</b><span class="zi">Oberster Gerichtshof (Supreme Court) prüft Gesetze auf Verfassungsmäßigkeit</span></div>
</div>
<ul>
<li><b>Midterm-Elections</b>: alle 2 Jahre. Alle Mitglieder des <b>Repräsentantenhauses</b> und <b>ein Drittel des Senats</b> werden neu gewählt. Die Wähler können so die Macht des Präsidenten nach der Hälfte seiner <b>4-jährigen</b> Amtszeit stärken oder schwächen.</li>
<li><b>Wahlmänner:</b> Jeder Bundesstaat bekommt so viele Wahlmänner, wie er <b>Kongressabgeordnete</b> hat (Abgeordnete im Repräsentantenhaus + 2 Senatoren). <span class="zi">insgesamt 538, man braucht 270</span></li>
<li><b><mark>„The winner takes it all“</mark></b>: ALLE Wahlmänner eines Staates gehen an den Sieger in diesem Staat. Die Stimmen des Verlierers sind <b>verloren</b>. Ausnahme: <b>Maine und Nebraska</b> (anteilige Verteilung).</li>
<li>Deshalb konnten <b>George W. Bush (2000)</b> und <b>Donald Trump (2016)</b> gewinnen, obwohl sie insgesamt <b>weniger</b> Stimmen als ihre Gegner hatten.</li>
</ul>
<h3 data-s="Vergleich mit Österreich">10. Vergleich mit Österreich und Regierungsformen</h3>
<table><tr><th>Funktion</th><th>USA</th><th>Österreich</th></tr>
<tr><td>Staatsoberhaupt</td><td>Präsident</td><td>Bundespräsident</td></tr>
<tr><td>Oberbefehl Streitkräfte</td><td>Präsident</td><td>Bundespräsident</td></tr>
<tr><td>Regierungschef</td><td>Präsident</td><td>Bundeskanzler</td></tr>
<tr><td>Chef der Bundesbürokratie</td><td>Präsident</td><td>gibt es nicht; Minister sind Chefs ihrer Ressorts, am ehesten Bundeskanzler</td></tr></table>
<h4>Demokratie hat viele Gesichter</h4>
<ul>
<li><b>Präsidentielle Demokratie (USA):</b> Der Präsident (= Exekutive) wird gewählt und bildet die Regierung. <b>Starke Gewaltentrennung</b>. Das Parlament wird separat gewählt.</li>
<li><b>Parlamentarische Demokratie (Österreich):</b> Die Regierung wird aus dem Parlament gebildet.</li>
<li><b>Wo ist in Österreich die Gewaltentrennung aufgelöst?</b> <span class="zi">Zwischen Legislative und Exekutive: Die Regierung stützt sich auf die Mehrheit im Nationalrat und kann von ihm durch ein Misstrauensvotum abgesetzt werden. Regierung und Parlamentsmehrheit gehören zu denselben Parteien.</span></li>
</ul>
<div class="zusatz"><b>Regierungsformen weltweit (Beispiele):</b>
<ul><li>Präsidentielle Demokratie: USA, Brasilien, Mexiko</li>
<li>Parlamentarische Demokratie: Österreich, Deutschland, Italien</li>
<li>Semipräsidentiell (Mischform): Frankreich</li>
<li>Parlamentarische Monarchie: Großbritannien, Spanien, Schweden, Niederlande</li>
<li>Konstitutionelle Monarchie (Monarch regiert, muss sich aber an die <b>Verfassung</b> halten): z.B. Marokko, Jordanien</li>
<li>Absolute Monarchie (Monarch regiert ohne Einschränkungen): Saudi-Arabien, Oman</li>
<li>(kommunistisches) Einparteiensystem: China, Nordkorea, Vietnam, Kuba</li></ul></div>

<p class="small">Quellen: Präsentationen, Arbeitsblatt „Die Französische Revolution (BS 72–77)“, Buchseiten 72–77, Arbeitsblatt Symbole.</p>
<h3 data-s="Ständegesellschaft">1. Ausgangslage: Absolutismus und Ständegesellschaft</h3>
<ul>
<li>Im Gegensatz zu England und den USA herrscht in Frankreich in der 2. Hälfte des 18. Jh. noch der <b>Absolutismus</b>.</li>
<li><b>1. Stand: Geistlichkeit</b>, <b>2. Stand: Adel</b>: genießen <b>Privilegien</b> wie zur Zeit Ludwigs XIV. und zahlen <b>keine Steuern</b>. Sie wehren sich gegen Reformen.</li>
<li><b>3. Stand: Bürger + Bauern</b> = <b><mark>98 % der Bevölkerung</mark></b>. Der 3. Stand <b><mark>bezahlt ALLES</mark></b>, hat aber <b><mark>KEINE politischen Rechte</mark></b>.</li>
<li>Karikatur: Ein alter Bauer trägt einen Adeligen und einen Geistlichen auf dem Rücken („Hoffen wir, dass das Spiel bald ein Ende nimmt“). Aussage: Der 3. Stand trägt die Last der oberen Stände.</li>
</ul>
<h3 data-s="Ursachen">2. Ursachen</h3>
<div class="flow"><div class="box"><b class="t">Hohe Staatsverschuldung</b>luxuriöses Hofleben in <b>Versailles</b>, stehendes Heer, <b><mark>Kriegsschulden</mark></b> (7-jähriger Krieg, amerikanischer Unabhängigkeitskrieg)</div><div class="arrow">→</div><div class="box"><b class="t">Hohe Steuern</b>nur vom 3. Stand eingehoben</div><div class="arrow">→</div><div class="box"><b class="t">Unzufriedenheit</b>3. Stand zahlt alles, hat keine Rechte</div></div>
<h3 data-s="Staatshaushalt">2b. Staatshaushalt und soziale Lage</h3>
<h4>Staatshaushalt 1788 (in Livres)</h4>
<table><tr><th>Ausgaben 629 Mio.</th><th>Einnahmen 503 Mio.</th></tr>
<tr><td>Schuldendienst (Tilgung und Zinsen) 318 Mio. · Militär 165 Mio. · Verwaltung 110 Mio. · Hofhaltung 36 Mio.</td><td>Steuern, Abgaben, Zölle → <b>Defizit 126 Mio.</b> (Neuverschuldung)</td></tr></table>
<p class="small">Merke: Fast die Hälfte der Ausgaben ging für alte Schulden drauf.</p>
<h4>Soziale Lage</h4>
<ul>
<li><b>Bauern</b>: hohe Abgaben, große Not, im Winter oft nichts zu essen.</li>
<li><b>Kleinbürger</b> (Handwerker, Händler) und <b>Lohnarbeiter</b> in den Städten: Lage wird schlechter.</li>
<li><b>Großbürgertum</b>: wohlhabend, aber von der <b>politischen Mitbestimmung ausgeschlossen</b>; fordert freie Entwicklung der Wirtschaft.</li>
<li><b>Missernten, Hungersnöte und Teuerungen</b> verschärfen die Wirtschaftskrise (1788/89).</li>
</ul>
<h3 data-s="Aufklärung">2c. Weitere Voraussetzungen: Aufklärung</h3>
<ul>
<li><b>Rousseau</b>: Gesellschaftsvertrag, <b><mark>Macht muss vom Volk ausgehen</mark></b> (<mark>Volkssouveränität</mark> statt Gottesgnadentum).</li>
<li><b>Montesquieu</b>: <b>Gewaltenteilung</b>.</li>
<li><b>Voltaire</b>: konstitutionelle Monarchie nach englischem Vorbild.</li>
<li><b>Gleichheit der Menschen</b>.</li>
<li><b>Vorbild USA</b>, wo diese Ideen umgesetzt werden.</li>
</ul>
<h3 data-s="Generalstände 1789">3. Anlass: Von den Generalständen zur Nationalversammlung (1789)</h3>
<ul>
<li>Um <b>noch mehr Steuern bewilligen zu lassen</b>, beruft König <b>Ludwig XVI.</b> die <b>Ständeversammlung (Generalstände)</b> ein. Sie hatte <b>1614</b> das letzte Mal getagt. Eröffnung am <b>5. Mai 1789</b> in Versailles. <span class="note">(in der Präsentation: „Im Juni 1789“)</span></li>
<li><b>Zusammensetzung:</b> Je Stand 300 Vertreter vorgesehen; unter Druck des Volkes erhält der 3. Stand <b>600 Vertreter</b>. Abstimmung bisher: <b>1 Stimme pro Stand</b> (1. + 2. Stand konnten den 3. immer überstimmen).</li>
<li><b>Streit:</b> Abstimmung <b>nach Ständen oder nach Köpfen</b>?</li>
<li><b><mark>17.6.1789</mark></b>: Der 3. Stand erklärt sich zur <b>(verfassungsgebenden) Nationalversammlung</b> = Vertretung des ganzen Volkes.</li>
<li><b>Ballhausschwur</b> <span class="zi">20.6.1789</span>: Im Ballhaus (königliche Sporthalle in Versailles) schwören die Vertreter, nicht auseinanderzugehen, bis Frankreich eine <b>Verfassung</b> hat.</li>
<li>Auch einige Vertreter des 1. und 2. Standes schließen sich an. Der König gibt nach und bestätigt die Nationalversammlung.</li>
</ul>
<h3 data-s="Bastille">4. Der Ausbruch: Sturm auf die Bastille (14. Juli 1789)</h3>
<ul>
<li>Nachrichten aus Versailles lösen in Paris Unruhen aus. Als der König <b>Truppen zusammenzieht</b>, entlädt sich der Unmut.</li>
<li>Die Pariser stürmen die <b>Bastille</b> (Gefängnis, Waffenarsenal, <b><mark>Symbol des Ancien Régime</mark></b>). Damit ist die Revolution ausgebrochen. Heute <b>französischer Nationalfeiertag</b>.</li>
<li><b>Auf dem Land:</b> Bauern bewaffnen sich, greifen Schlösser und Gutsverwaltungen an und <b>verbrennen Abgabenlisten</b> (Bäuerliche Revolution).</li>
</ul>
<h3 data-s="Ende des Feudalismus">5. Das Ende von Absolutismus und Feudalismus</h3>
<ul>
<li><b>Augustgesetze 1789</b> <span class="zi">4./5. August</span>: <b><mark>Abschaffung des Feudalsystems</mark></b> (grundherrliche Rechte, bäuerliche Pflichten, Privilegien von Adel und Klerus). <b>Auswirkung für die Bauern:</b> Ihre Forderungen sind weitgehend erfüllt, sie werden frei.</li>
<li><b><mark>26. August 1789: Erklärung der Menschen- und Bürgerrechte</mark></b> nach dem Vorbild der amerikanischen Bill of Rights, als Grundlage einer späteren Verfassung: Die Menschen werden <b>frei und gleich an Rechten</b> geboren. Menschenrechte: <b>Freiheit, Eigentum, Sicherheit, Widerstand gegen Unterdrückung</b>. Der Ursprung jeder Herrschaft liegt <b>beim Volk</b>.</li>
<li><b>Verhältnis zur Kirche:</b> Die katholische Kirche wird <b>enteignet</b> (Einziehung der Kirchengüter), Schulen verstaatlicht, <b>Zivilehe</b> eingeführt (Trennung von Staat und Kirche). Geistliche, die den <b>Eid</b> auf die neue Ordnung verweigern, werden als Staatsfeinde verfolgt. Folge: Sie und die kirchentreue Bevölkerung werden ein <b>Herd des Widerstands</b> (z.B. Vendée). <span class="note">(im Buch als „Augustgesetze“ zusammengefasst; tatsächlich wurden diese Gesetze schrittweise 1789–1792 beschlossen: Kirchengüter 1789, Priestereid 1790, Zivilehe 1792)</span></li>
<li><b>Wirtschaftsgesetze (Wirtschaftsliberalismus):</b> Das wohlhabende Bürgertum setzt sich durch: <b>Zünfte und Zunftzwang abgeschafft</b>, <b>Berufs- und Gewerbefreiheit</b>. Die Krise soll durch das freie Spiel von <b>Angebot und Nachfrage</b> gelöst werden. Folge: Lage der <b>Lohnarbeiter</b> verschlechtert sich; als sie streiken, <b>verbietet</b> die Nationalversammlung Zusammenschlüsse und Streiks.</li>
<li><b>Wirtschaftsliberalismus</b> = freie Marktwirtschaft, ein sich selbst regulierendes System, gesteuert durch die <b>„unsichtbare Hand“</b> des Marktes (Adam Smith); der Staat greift nicht ein.</li>
</ul>
<h3 data-s="Verfassung 1791">6. Konstitutionelle Monarchie (Verfassung 1791)</h3>
<ul>
<li><b>„Flucht nach Varennes“</b> (Juni 1791): Die Königsfamilie versucht ins Ausland zu fliehen, wird gefangen genommen. Der König gilt seither als <b>Verräter</b>. Trotzdem schwört er den Eid auf die Verfassung.</li>
<li><b>September 1791</b>: Verfassung → <b>konstitutionelle Monarchie</b>. „Rollenverteilung“: <b><mark>König = Exekutive</mark></b> (ausführende Gewalt); <b>Legislative und Judikative</b> = gewählte Volksvertreter.</li>
<li><b>Zensuswahlrecht</b> = <mark>Wahlrecht nur für <b>wohlhabende Bürger</b></mark>, nach Besitz und Einkommen.</li>
<li><b>In der Legislative (erste gewählte Volksvertretung):</b>
<ul><li><b>Rechts:</b> besitzendes Bürgertum, sieht die Revolution als beendet, für die konstitutionelle Monarchie.</li>
<li><b>Links:</b> <b>Girondisten</b> (gemäßigte Bürgerliche aus der Provinz, Wortführer aus der Gironde) und <b>Jakobiner</b> (revolutionäre Bürgerliche, meist Intellektuelle, benannt nach dem Kloster St. Jakob in Paris; <b>Robespierre, Danton, Marat</b>), offen für die Republik.</li></ul></li>
<li class="small">Daher kommen unsere Begriffe „rechts“ und „links“ in der Politik.</li>
</ul>
<h3 data-s="Krieg & Republik">7. Krieg und Republik (1792)</h3>
<ul>
<li>Europas Herrscher fürchten das Übergreifen der Revolution, die Untertanen begrüßen die Ideen. Eine österreichisch-preußische Erklärung unterstützt den König.</li>
<li><b>1792: Frankreich erklärt Österreich den Krieg</b> <span class="zi">20. April 1792</span>. <b>Koalitionskriege</b>: Österreich mit Preußen, nach der Hinrichtung des Königs auch England, Holland, Spanien, Sardinien(-Piemont), Neapel und das Reich.</li>
<li><b>Motive</b> von Österreich, Preußen, Russland, Spanien, Piemont: <span class="zi">Angst, dass die Revolution auf ihre Länder übergreift; Wiederherstellung der Macht des Königs (Marie Antoinette war eine Habsburgerin, Tante des Kaisers Franz II.); Hoffnung auf Gebietsgewinne</span></li>
<li><b>Marseillaise</b>: Freiheitslied, in Straßburg entstanden, im Juli 1792 von Freiwilligen aus Marseille beim Einzug in Paris gesungen. Heute <b>Nationalhymne</b>.</li>
<li><b>20. Juni 1792</b>: Das Volk zwingt dem König die <b>Freiheitsmütze</b> auf.</li>
<li>Der <b>Herzog von Braunschweig</b> droht dem Pariser Volk mit blutiger Rache, falls dem König etwas zustößt. Der König erscheint endgültig als Verräter.</li>
<li><b>August 1792: Sturm auf die Tuilerien</b> (Königspalast in Paris) <span class="zi">10. August</span>, Gefangennahme der königlichen Familie. Massenverhaftungen und Hinrichtungen von Adeligen und Priestern.</li>
<li><b>Nationalkonvent</b>: erstmals <b>allgemeines und gleiches Wahlrecht</b>: <b><mark>alle Männer über 21</mark></b>.</li>
<li><b>21. September 1792</b>: Abschaffung der Monarchie, <b><mark>Ausrufung der Republik</mark></b>.</li>
<li>Prozess wegen Landesverrats gegen <b>„Bürger Capet“</b> (Adelstitel abgeschafft): mit einer Stimme Mehrheit zum Tod verurteilt.</li>
<li><b><mark>21.1.1793: Hinrichtung Ludwigs XVI.</mark></b> auf der Place de la Révolution (heute <b>Place de la Concorde</b>) <span class="note">(im Arbeitsblatt: „1792 Hinrichtung von Ludwig XVI“)</span>. <b>1793</b> <span class="zi">16. Oktober</span>: Hinrichtung von <b>Marie Antoinette</b>, Tochter Maria Theresias.</li>
<li><b>Republikanische Verfassung 1793</b>: Volkssouveränität, Gleichheit, bürgerliche Freiheitsrechte, <b>Recht auf Arbeit</b>; trat aber <b>nie in Kraft</b>.</li>
</ul>
<h3 data-s="Schreckensherrschaft">8. Die Schreckensherrschaft der Jakobiner (1793–1794)</h3>
<p><span class="note">(im Arbeitsblatt: „1792–1794 Terrorherrschaft“; in der Präsentation und im Buch: 1793–1794)</span></p>
<ul>
<li><b>Jakobiner</b> = radikaler politischer Klub der Revolution (nach dem Kloster St. Jakob). <b>Anführer: <mark>Maximilien de Robespierre</mark></b>.</li>
<li>Nach der Hinrichtung des Königs: schlechte Wirtschaftslage, Brotmangel, Teuerung, Demonstrationen. Ein Aufstand der <b>Sansculotten</b> führt dazu, dass die <b>Girondisten</b> (für freie Wirtschaft) aus dem Konvent <b>vertrieben</b> werden. Die radikalen Jakobiner erhalten die <b>Mehrheit</b>.</li>
<li><b>Wohlfahrtsausschuss</b> = oberstes Regierungsorgan, Vorsitzender <b>Robespierre</b> (1793).</li>
<li><b>Wer wird verfolgt?</b> Alle „<b>Feinde der Republik</b>“: Adelige, Priester, Girondisten, auch frühere Weggefährten wie <b>Georges Danton</b>, weil er einen Ausgleich wollte. Oft genügte ein <b>bloßer Verdacht</b> für das Todesurteil.</li>
<li><b>Opferzahlen:</b> in einem Jahr etwa <b><mark>40.000 Menschen hingerichtet</mark></b>. Die <b>Guillotine</b> (Fallbeil) wird zum Symbol der Schreckensherrschaft.</li>
<li><b>Revolutionsgericht</b> (Bildanalyse): <span class="zi">kein unabhängiger Richter, kein Verteidiger, keine Unschuldsvermutung, kein Recht auf Beweise, Urteil steht vorher fest, Zuschauer drohen</span></li>
<li><b>Militärische Rettung:</b> Der Wohlfahrtsausschuss führt die <b>allgemeine Wehrpflicht</b> ein (<b>levée en masse</b> = Massenrekrutierung). Die Revolutionsarmee schlägt die Feinde zurück und marschiert in Nachbarländer ein.</li>
<li><b>Im Inneren:</b> Wirtschaftskrise nicht bewältigt; trotz <b>Höchstpreisen</b> für Nahrungsmittel weitere Preissteigerungen. Trotz Hinrichtung von „Wirtschaftsverbrechern“ verlieren die Jakobiner die Unterstützung der Unterschichten.</li>
<li><b>Ende:</b> Robespierre verstärkt den Terror weiter → bürgerliche Gegner und eigene Gefährten verhaften ihn. <b><mark>Hinrichtung Robespierres am 28.7.1794</mark></b>. Grund: Niemand war mehr sicher, der Terror richtete sich auch gegen die eigenen Leute.</li>
</ul>
<h3 data-s="Direktorium">9. Das Direktorium (1795–1799) und das Ende der Revolution</h3>
<ul>
<li>Das <b>Besitzbürgertum</b> (Großbürgertum) gewinnt wieder die Oberhand: <b>neue Verfassung</b> (die dritte in vier Jahren), <b>Wiedereinführung des Zensuswahlrechts</b>.</li>
<li>Regierung durch <b><mark>5 Direktoren</mark></b> = <b>Direktorium</b>. Vertritt vor allem die Interessen des <b>Großbürgertums</b>; <b>Korruption</b>. Aufstände von Royalisten und Pariser Bevölkerung.</li>
<li><span class="note">(in der Präsentation: „1794–1799 Direktorium“; nach Robespierres Sturz 1794 folgte eine Übergangszeit, das Direktorium selbst regierte ab 1795)</span></li>
<li>Nach 4 Jahren <b>militärischer Staatsstreich</b> des Armeegenerals <b>Napoleon</b> (<b>9.11.1799</b>). Damit ist die Revolution nach <b>zehn Jahren</b> endgültig beendet.</li>
</ul>
<h3 data-s="3 Phasen">10. Die drei Phasen der Revolution</h3>
<div class="scroll"><table><tr><th>Phase</th><th>Zeit</th><th>Titel</th><th>Wichtig</th></tr>
<tr><td>1. Phase</td><td>1789–1792</td><td>Gemäßigte Phase: Bürgerliche Revolution und konstitutionelle Monarchie</td><td>Nationalversammlung, Bastille, Menschenrechte, Abschaffung der Privilegien, Verfassung 1791, Krieg gegen Österreich</td></tr>
<tr><td>2. Phase</td><td>1792/93–1794</td><td>Radikale Phase: Republik und Schreckensherrschaft</td><td>Republik, Hinrichtung des Königs, Wohlfahrtsausschuss, allgemeiner Wehrdienst, Terrorgesetze, Robespierre</td></tr>
<tr><td>3. Phase</td><td>1795–1799</td><td>Bürgerliche Phase: Direktorium</td><td>Zensuswahlrecht, 5 Direktoren, Korruption, Staatsstreich Napoleons (Konsulatsverfassung 1799)</td></tr></table></div>
<p class="small">Die Phasentitel stammen aus der Aufgabe „Gib jeder Phase einen Titel“; die Grafik im Buch zeigt die Revolution als Kurve, die bis 1794 radikaler wird und dann abfällt.</p>
<h3 data-s="Symbole">11. Symbole und Alltag der Revolution</h3>
<table><tr><th>Symbol</th><th>Bedeutung</th></tr>
<tr><td>Motto</td><td><b><mark>„Liberté, Égalité, Fraternité“</mark></b> (Freiheit, Gleichheit, Brüderlichkeit), steht heute auf der französischen 2-Euro-Münze</td></tr>
<tr><td>Freiheitsbaum</td><td>Bürger versammelten sich „zufällig“ im Schatten von Bäumen im Ortszentrum (eingeschränkte Versammlungsfreiheit); in der Revolution überall als Symbol der Freiheit gepflanzt</td></tr>
<tr><td>Kampflied</td><td><b>„Marseillaise“</b>, seither französische Nationalhymne</td></tr>
<tr><td>Feiertag</td><td><b>14. Juli</b> (1789 Erstürmung der Bastille), heute Nationalfeiertag</td></tr>
<tr><td>Flagge</td><td><b>Trikolore</b>: Rot und Blau (Wappen von Paris) + Weiß (Farbe des Königs)</td></tr>
<tr><td>Kleidung</td><td><b>Jakobinermütze</b> (rote Mütze) und <b>Kokarde</b>; <b>Sansculottes</b>: Revolutionäre tragen lange Hosen statt der Kniebundhosen (culottes) des Adels</td></tr>
<tr><td>Anrede</td><td>„Bürger“ statt „Herr“</td></tr></table>
<ul>
<li><b>Pileus</b>: Filzkappe, die in der römischen Antike <b>Sklaven bei ihrer Freilassung</b> als Zeichen der Freiheit bekamen (auf der Brutusmünze: Befreiung von Cäsar). <b>Verwechslung:</b> Die Revolutionäre hielten irrtümlich die antike <b>phrygische Mütze</b> für dieses Freiheitszeichen.</li>
<li>Die Rote Mütze erscheint später in den <b>Wappen Kubas und Argentiniens</b>.</li>
<li><b>„Frisur zur Unabhängigkeit oder der Triumph der Freiheit“</b>: Anlass war ein französischer Seesieg 1778 gegen ein britisches Schiff im amerikanischen Unabhängigkeitskrieg. Widerspruch: Die Frisur feiert „Freiheit“, wird aber von <b>Marie Antoinette und Hofdamen</b> getragen, die für Luxus und Privilegien stehen. Man machte sich in Schmähschriften („libelles“) darüber lustig.</li>
<li><b>Religion:</b> Der christliche Kalender wird abgeschafft, statt Gott wird der <b>„Kult des höchsten Wesens“</b> gefeiert; viele Kirchen werden zu <b>„Tempeln der Vernunft“</b>.</li>
<li>Die alte Provinzeinteilung wird abgeschafft. Große <b>Feste</b> feiern die Revolution.</li>
</ul>
<h3 data-s="Kalender & Meter">12. Revolutionskalender und Dezimalsystem</h3>
<ul>
<li>Neue Jahreszählung ab <b>22. September 1792</b> (Republik). Statt Wochen: <b>Dekaden (10 Tage)</b>: Primidi, Duodi, Tridi, Quartidi, Quintidi, Sextidi, Septidi, Octidi, Nonidi, Decadi.</li>
<li>Jeder Monat hat <b>30 Tage</b>, benannt nach Natur und Tätigkeiten; dazu <b>6 Übergangstage</b> am Jahresende (<b>Sansculottiden</b>, Feiertage). Sinn: Bruch mit Kirche und Königtum (unsere Monate sind nach römischen Göttern, Kaisern und Zahlen benannt), Vernunft und Natur statt Religion.</li>
<li><b>Dezimaluhr</b>: auch die Zeit sollte dezimal sein <span class="zi">10 Stunden pro Tag, 100 Minuten pro Stunde</span>.</li>
<li><b>1806</b> führte Napoleon den <b>gregorianischen Kalender</b> wieder ein.</li>
</ul>

<h4>Das metrische System</h4>
<ul>
<li><b>1793</b> definiert die Nationalversammlung: <b>„1 Meter ist der 10-millionste Teil des Erdquadranten auf dem Meridian von Paris“</b> (Strecke Nordpol–Äquator).</li>
<li><b>Kilogramm</b> ist vom Meter abgeleitet: <b>Gewicht eines Kubikdezimeters Wasser = 1 kg</b>.</li>
<li>Durch <b>Napoleon</b> verbreitet, <b>internationaler Standard erst 1875</b>.</li>
</ul>
<h3 data-s="Bedeutung">13. Bedeutung der Französischen Revolution</h3>
<ul>
<li><b>Ursachen von Revolutionen:</b> tiefe Gegensätze zwischen Herrschenden und Beherrschten; vorbereitet durch geistige Strömungen (Aufklärung), ausgelöst oft durch Wirtschaftskrisen. <b>Ziel:</b> Änderung der gesellschaftlichen und wirtschaftlichen Ordnung.</li>
<li><b>Revolution vs. Reform:</b> Revolution = <b>Umwälzung</b> (radikal, oft gewaltsam); Reform = dem Alten eine <b>neue Form</b> geben (schrittweise Veränderung).</li>
<li>Die Revolution beendete den <b>absolutistischen Staat</b> und die <b>feudale Wirtschaftsform</b> und setzte <b>Ideen der Aufklärung</b> um. Statt Gottesgnadentum: <b>Volkssouveränität</b>. Vorrechte von Adel und Kirche beseitigt; Standesunterschiede aufgehoben, aber <b>soziale Unterschiede blieben</b>.</li>
<li><b>„Bürgerliche Revolution“</b>: vom Bürgertum ausgegangen und getragen; brachte dem Bürgertum politischen Einfluss und die gewünschte Wirtschaftsordnung.</li>
<li>Sie zeigt auch: Freiheit, Gleichheit, Brüderlichkeit können <b>nicht mit Gewalt und Terror</b> verwirklicht werden.</li>
<li>Nach 1789 setzt sich in Europa die Ansicht durch, dass an die Stelle der Gewalt des Königs die <b>Herrschaft des Volkes</b> treten soll.</li>
<li><b>Rechtsstaatlichkeit</b>: eine Forderung der Revolution. Im Rechtsstaat müssen alle Handlungen <b>legal</b> (gesetzeskonform) sein; dazu braucht es eine <b>unabhängige Justiz</b>. Statt Herrschaft durch Machtdemonstration, Willkür und Gewalt gilt die <b>verbindliche Kraft des Rechts</b>. In der österreichischen Verfassung verankert; der <b>Verfassungsgerichtshof</b> prüft Gesetze.</li>
</ul>
<h4>Mindmap 1: Ideen der Revolution</h4>
<p>Freiheit · Gleichheit · Brüderlichkeit · Republik · Nationalismus · Menschenrechte · Metrisches System (ab 1875 international) · Code Civil (bürgerliches Recht)</p>

id:"nap", tab:"Napoleon", color:"#6a1b9a",
title:"Napoleon Bonaparte: Aufstieg und Fall (1799–1815)",
ueberblick:"Der General Napoleon beendet 1799 durch einen Staatsstreich die Revolution, wird 1804 Kaiser und beherrscht nach Siegen wie Austerlitz (1805) fast ganz Europa. Er verbreitet den Code Civil und Ideen der Revolution, beutet aber die eroberten Länder aus und weckt so den Nationalismus. Nach der Niederlage in Russland (1812), bei Leipzig (1813) und Waterloo (1815) wird er verbannt.",
kern:"Napoleon ist Revolutionär und Reaktionär zugleich: Er beendet die Revolution und regiert als Kaiser, verbreitet aber ihre Ideen (Code Civil, Gleichheit vor dem Gesetz) in ganz Europa. Seine Eroberungen lösen den modernen Nationalismus aus.",
body:`
<blockquote class="card"><b>Napoleon am 15. Dezember 1799:</b> „[…] Bürger, die Revolution ist den Grundsätzen, von denen sie ihren Ausgang nahm, fest verbunden; sie ist beendet.“<br><b>Motto:</b> „Nur wer mit dem Stiefel regiert, behält die Macht.“</blockquote>
<h3 data-s="Aufstieg">1. Der Aufstieg Napoleons</h3>
<div class="scroll"><table><tr><th>Jahr</th><th>Ereignis</th></tr>
<tr><td>1769</td><td>Geboren auf <b>Korsika</b> als Sohn eines italienischen Rechtsanwalts</td></tr>
<tr><td>1779–1785</td><td>Militärschule in <b>Brienne und Paris</b></td></tr>
<tr><td>1793</td><td>Beförderung zum <b>General mit 24 Jahren</b></td></tr>
<tr><td>1794</td><td>Freundschaft mit <b>Robespierre</b> → nach dessen Sturz kurzzeitige Inhaftierung</td></tr>
<tr><td>5. Okt. 1795</td><td>Niederschlagung eines royalistischen Aufstands → Oberbefehl im Krieg gegen Österreich</td></tr>
<tr><td>1796/97</td><td>Siegreicher <b>Italienfeldzug</b> → danach <b>Ägyptenfeldzug</b> <span class="zi">1798–1799</span></td></tr>
<tr><td>1799</td><td><b><mark>Staatsstreich</mark></b> (9.11.1799) → <b><mark>Erster Konsul</mark></b> (Konsulatsverfassung)</td></tr>
<tr><td>1804</td><td><b><mark>Krönung zum Kaiser</mark></b> der Franzosen (<b>2.12.1804</b>) <span class="zi">Er setzte sich die Krone in Notre-Dame selbst auf; der Papst war nur anwesend.</span></td></tr>
<tr><td>1805</td><td>Napoleon krönt sich zum <b>König von Italien</b></td></tr></table></div>
<h3 data-s="Revolutionär & Reaktionär">2. Napoleon: Revolutionär und Reaktionär</h3>
<table><tr><th>Revolutionär (bewahrt Ideen der Revolution)</th><th>Reaktionär (gegen die Revolution)</th></tr>
<tr><td><b>Plebiszite</b> (= Volksabstimmungen) bei wichtigen Entscheidungen (als 1. Konsul 1799–1804)<br><b>Code Civil</b> <span class="zi">1804</span>: <b><mark>gleiches Recht für alle</mark></b>, keine Vorrechte für den Adel → Grundlage des modernen europäischen Zivilrechts<br>Verbreitung des metrischen Systems</td><td><b>Beendet 1799 die Revolution</b>, erklärt sich zum 1. Konsul<br><b>Kaiserkrönung 1804</b>: Ende der Volksherrschaft, Wiedereinführung der Monarchie<br><b>Konkordat</b> <span class="zi">1801</span>: Vertrag mit der Kirche, bringt ihm deren Unterstützung<br>1806 Rückkehr zum gregorianischen Kalender</td></tr></table>
<p><b>Propaganda:</b> Das Gemälde „Napoleon am St. Bernhard“ von Jacques-Louis David (kaiserlicher Hofmaler) zeigt ihn als Helden auf einem sich aufbäumenden Pferd; auf dem Felsen stehen die Namen von Hannibal und Karl dem Großen. In Wirklichkeit ritt er auf einem <b>Maultier</b> und trug einen gewöhnlichen Waffenrock.</p>
<h3 data-s="Gipfel der Macht">3. Napoleon am Gipfel der Macht</h3>
<p><b>Export der Revolution oder Hegemonialstreben?</b> In 15 Jahren Herrschaft hatte Frankreich nur ein Jahr Frieden. Die Kriege dienten vor allem der <b>Hegemonialpolitik</b> (Vorherrschaft), exportierten aber auch das französische Staatsmodell, die bürgerliche Gleichheit und den Code Napoléon. Ziel: <b>England unterwerfen und den Kontinent beherrschen</b>.</p>
<ul>
<li><b>1804/1805:</b> Geplanter Angriff auf England scheitert an der starken <b>britischen Flotte</b> (Überquerung des Ärmelkanals unmöglich). <b>1805: vernichtende Niederlage zur See bei Trafalgar</b> <span class="zi">gegen den britischen Admiral Nelson</span>.</li>
<li><b>Austerlitz (1805)</b> <span class="zi">2. Dezember</span>: Sieg über Österreich und Russland („<b><mark>Dreikaiserschlacht</mark></b>“). Wien wird besetzt.
<ul><li>→ <b>Frieden von Pressburg</b> mit Österreich: <b>Tirol</b> (und Vorarlberg) an <b>Bayern</b>, Venetien und Dalmatien an Frankreich; als Ausgleich bekommt Österreich <b>Salzburg</b>.</li>
<li>→ Folge in Tirol: <b>Tiroler Freiheitskampf unter Andreas Hofer</b> (1809).</li></ul></li>
<li><b>Jena und Auerstedt (1806)</b>: vernichtender Sieg über <b>Preußen</b> (und Sachsen). Im <b>Frieden von Tilsit</b> <span class="zi">1807</span> verliert Preußen <b>mehr als die Hälfte</b> seines Gebietes. Diese Länder werden <b>Satellitenstaaten</b>.</li>
<li><b>Rheinbund (1806)</b>: Bund von <b>16 deutschen Fürsten/Staaten</b>, die mit Napoleon verbündet sind. Bayern und Württemberg werden Königreiche.
<ul><li>→ Folge: <b><mark>1806 Auflösung des „Heiligen Römischen Reiches Deutscher Nation“</mark></b>: Franz II. legt die Kaiserkrone nieder <span class="zi">Er blieb als Franz I. Kaiser von Österreich (seit 1804).</span></li></ul></li>
</ul>
<h3 data-s="Kontinentalsperre">4. Wirtschaftskrieg gegen England: Kontinentalsperre (1806–1814)</h3>
<ul>
<li>Da Napoleon England militärisch nicht besiegen konnte, wollte er es <b>wirtschaftlich ruinieren</b>.</li>
<li><b><mark>1806 „Kontinentalsperre“</mark></b>: Verbot jedes Handels mit England; alle abhängigen Staaten müssen mitmachen. <span class="note">(in der Präsentation Tippfehler „1806–18014“, richtig: 1806–1814)</span></li>
<li>Zur Durchsetzung: <b>Spanien und Portugal besetzt</b>, der <b>Papst gefangen genommen</b>, der Kirchenstaat aufgeteilt.</li>
<li>Folgen für England zunächst hart (Arbeitslosigkeit, Absatzkrisen, kein Getreide aus Russland und Preußen), aber England <b>überstand die Krise</b> und fand neue Märkte in Übersee. Der Wirtschaftskrieg war <b>gescheitert</b>.</li>
</ul>
<h3 data-s="Völker wehren sich">5. Der Abstieg: Die Völker wehren sich</h3>
<ul>
<li>Die rücksichtslose Politik und die harte <b>Auspressung</b> der eroberten Länder wecken <b>(nationale) Gegenkräfte</b>. Erstmals seit langem wird die Bevölkerung selbst aktiv. Einnahmen Napoleons aus besetzten Ländern z.B.: 4 Mio. pro Jahr von Spanien, 30 Mio. von Italien; von Österreich 1805 118 Mio. verlangt (mind. 75 Mio. erhalten), 1809 250 Mio. verlangt (164 Mio. bezahlt). <b>„Der Krieg ernährt den Krieg“</b>: Die Armee lebte auf Kosten der Besiegten. Am meisten betroffen: die <b>Bevölkerung</b> der besetzten Länder.</li>
<li><b>1808/09: Volksaufstände in Spanien und Österreich</b>.</li>
<li><b>1809:</b> Österreich erklärt Frankreich erneut den Krieg. Bei <b>Aspern</b> schlägt <b>Erzherzog Karl</b> Napoleon zum <b><mark>ersten Mal</mark></b>. Wichtig: Die <b><mark>Legende von Napoleons Unbesiegbarkeit</mark></b> ist zerstört. Wenige Wochen später siegt Napoleon aber bei <b>Deutsch-Wagram</b>.</li>
<li><b>Frieden von Schönbrunn (1809)</b>: Österreich verliert Salzburg und das Innviertel an Bayern; Dalmatien, Istrien, Kroatien, Osttirol und Teile Kärntens werden zu einem französischen Gebiet zusammengefasst <span class="note">(im Buch: „Königreich Dalmatien“; historisch hießen sie „Illyrische Provinzen“)</span>.</li>
<li><b>Heirat mit Marie Louise</b> <span class="zi">1810</span>, Tochter von Kaiser Franz I. (von seiner ersten Frau Joséphine ließ er sich scheiden). Ziel: auf eine Stufe mit den alten Fürstenhäusern kommen.</li>
<li><b>Andreas Hofer</b>: Tiroler Bauer und Wirt. 1809 vertreibt ein Bauernaufgebot unter seiner Führung die bayrische Besatzung; in <b>drei Schlachten am Berg Isel</b> bei Innsbruck werden bayrische und französische Truppen besiegt. Nach dem Frieden von Schönbrunn führt er, <b>von Wien allein gelassen</b>, einen vergeblichen Kleinkrieg weiter. Von einem Landsmann <b>verraten</b>, wird er in <b>Mantua</b> standrechtlich <b>erschossen</b> <span class="zi">1810</span>. <span class="zi">Heute Tiroler Nationalheld.</span></li>
</ul>
<h3 data-s="Russland 1812">6. Napoleons Debakel in Russland (1812)</h3>
<ul>
<li>Zar <b>Alexander I.</b> nimmt wieder Handel mit England auf (Getreide, Holz) → bricht die Kontinentalsperre.</li>
<li>Napoleon stellt das bisher <b>größte Heer der Geschichte</b> auf: die <b>Grande Armée</b>, über <b>600.000 Mann</b>, nur etwa ein Drittel Franzosen; starke Kontingente aus <b>Österreich, Preußen und Sachsen</b>.</li>
<li>Ende Juni 1812 Einmarsch; verlustreiche Siege, aber Russland nicht besiegt. Napoleon nimmt <b>Moskau</b> ein, doch die Stadt ist fast leer, am nächsten Tag zerstört ein <b>Brand</b> weite Teile.</li>
<li>Der russische Feldherr <b>Kutusow</b> wendet die Taktik der <b><mark>„verbrannten Erde“</mark></b> an → Versorgungsprobleme; dazu der <b>russische Winter</b>.</li>
<li><b>Ende Oktober 1812: Rückzug</b>. <span class="zi">Auf dem Rückzug durch Kälte, Hunger und russische Angriffe (z.B. am Fluss Beresina) geht die Grande Armée fast vollständig zugrunde; nur einige Zehntausend kehren zurück.</span></li>
</ul>
<h3 data-s="Das Ende">7. Das Ende (1813–1815)</h3>
<ul>
<li><b>1813 Befreiungskriege</b>: <span class="zi">Preußen, Russland, Österreich und Schweden verbünden sich gegen Napoleon.</span></li>
<li><b><mark>1813: Niederlage in der „Völkerschlacht“ bei Leipzig</mark></b> <span class="zi">16.–19. Oktober 1813</span>.</li>
<li><span class="zi">1814 erobern die Verbündeten Paris; Napoleon dankt im April 1814 ab.</span> → <b>Verbannung nach Elba</b> (Insel im Mittelmeer).</li>
<li><span class="zi">1815 kehrt er zurück und regiert noch einmal etwa 100 Tage („Herrschaft der Hundert Tage“), während der Wiener Kongress tagt.</span></li>
<li><b><mark>1815: Endgültige Niederlage bei Waterloo</mark></b> <span class="zi">18. Juni 1815, gegen die Briten unter Wellington und die Preußen unter Blücher</span> → <b>Verbannung nach St. Helena</b> (Insel im Südatlantik) <span class="zi">dort gestorben 1821</span>.</li>
</ul>
<h3 data-s="Nachwirkungen">8. Nachwirkungen von Napoleons Herrschaft (Mindmap 2)</h3>
<ul>
<li><b>Code Civil</b> (bürgerliches Recht, Gleichheit vor dem Gesetz)</li>
<li><b>Beendet die Revolution</b></li>
<li><b>† Heiliges Römisches Reich 1806</b></li>
<li><b><mark>Beginn des modernen Nationalismus</mark></b></li>
<li><b>Idee: Italien als eigener Staat</b></li>
<li>Verbreitung des <b>metrischen Systems</b></li>
<li>Die <b>Ideen der Revolution</b> (Freiheit, Gleichheit, Brüderlichkeit, Menschenrechte, Republik, Nationalismus) lassen sich <b>nicht mehr aus den Köpfen</b> der Menschen entfernen.</li>
</ul>
<h4>Warum trug die Eroberungspolitik zum Nationalismus bei?</h4>
<p>Die besetzten Völker litten unter Ausbeutung, Steuern und Soldatenaushebungen. Gegen den gemeinsamen fremden Feind entstand ein <b>„Wir-Gefühl“</b> (z.B. in Spanien, Tirol, Preußen). Gleichzeitig brachte Napoleon die französische Idee der <b>Nation</b> und der Volksarmee mit.</p>
<h4>Karte: Europa 1812</h4>
<p>Arbeitsfrage zur Karte: Rheinbund? Abhängige / Verbündete Napoleons? 1812?</p>
<div class="zusatz">Frankreich direkt bis an die Nordsee und nach Italien; abhängig bzw. verbündet: <b>Rheinbund</b>, Königreich Italien, Spanien (Bruder Joseph), Herzogtum Warschau, Neapel; 1812 auch Österreich und Preußen gezwungen verbündet. Nicht beherrscht: <b>England</b>, <b>Russland</b> (bis 1812 verbündet), Schweden, Osmanisches Reich.</div>

merke:["1799 Staatsstreich → 1. Konsul; 1804 Kaiser: Napoleon beendet die Revolution.","Revolutionär (Code Civil, Plebiszite) und Reaktionär (Kaisertum, Konkordat, Ende der Volksherrschaft).","Austerlitz 1805 (Dreikaiserschlacht) → Pressburg: Tirol an Bayern; 1806 Rheinbund → Ende des Heiligen Römischen Reiches.","Kontinentalsperre 1806 gegen England scheitert; Trafalgar 1805 verloren.","Abstieg: Aspern 1809 (erste Niederlage), Russland 1812, Leipzig 1813 → Elba, Waterloo 1815 → St. Helena. Folge: Nationalismus."],
fragen:[
{op:"beschreiben",q:"Beschreibe den Aufstieg Napoleons bis 1804.",a:"Geboren 1769 auf Korsika, Militärschule, mit 24 General (1793). 1795 Niederschlagung eines royalistischen Aufstands, 1796/97 siegreicher Italienfeldzug, Ägyptenfeldzug. 1799 Staatsstreich gegen das Direktorium, Erster Konsul; 1804 Kaiser der Franzosen."},
{op:"nennen",q:"Nenne Ort, Gegner und Datum von zwei wichtigen Siegen Napoleons.",a:"Austerlitz, 1805, gegen Österreich und Russland (Dreikaiserschlacht). Jena und Auerstedt, 1806, gegen Preußen (und Sachsen)."},
{op:"erklären",q:"Erkläre, was der Rheinbund war und welche Folgen er hatte.",a:"1806 schlossen sich 16 deutsche Fürsten zu einem mit Napoleon verbündeten Bund zusammen. Bayern und Württemberg wurden Königreiche. Folge: Franz II. legte die Kaiserkrone nieder, das Heilige Römische Reich Deutscher Nation endete 1806."},
{op:"erklären",q:"Fasse zusammen, warum Napoleon England nicht erobern konnte und was die Kontinentalsperre war.",a:"Die starke britische Flotte machte eine Überquerung des Ärmelkanals unmöglich (Niederlage bei Trafalgar 1805). Deshalb wollte Napoleon England wirtschaftlich ruinieren: Kontinentalsperre 1806 = Handelsverbot mit England für ganz Europa. England fand aber neue Märkte in Übersee, die Sperre scheiterte."},
{op:"nennen",q:"Wo und von wem wurde Napoleon zum ersten Mal besiegt? Warum war das wichtig?",a:"1809 bei Aspern von Erzherzog Karl. Wichtig: Die Legende von Napoleons Unbesiegbarkeit war zerstört, auch wenn er wenig später bei Wagram siegte."},
{op:"beurteilen",q:"Beurteile die Heirat Napoleons mit Marie Louise aus Sicht eines Revolutionärs der ersten Stunde.",a:"Ein Revolutionär wäre empört: Die Revolution hatte den König hingerichtet und den Adel abgeschafft, und Marie Louise ist eine Habsburgerin wie Marie Antoinette. Napoleon will sich damit auf eine Stufe mit den alten Fürstenhäusern stellen, also mit genau dem System, das die Revolution bekämpft hat. Das zeigt, dass er die Ideen der Revolution verraten hat."},

<h3 data-s="Aufgabe & Teilnehmer">1. Aufgabe und Teilnehmer</h3>
<ul>
<li><b>Aufgabe:</b> <b><mark>Neuordnung Europas</mark></b> nach dem Sieg über Napoleon.</li>
<li><b>Teilnehmer:</b> <b>Österreich, Preußen, Russland, England, Frankreich</b>.</li>

</ul>
<h3 data-s="Leitideen">2. Leitideen</h3>
<table><tr><th>Leitidee</th><th>Bedeutung</th></tr>

<tr><td><b>Gleichgewicht der Mächte</b></td><td>nach britischer Doktrin der Außenpolitik: <b><mark>„Balance of Power“</mark></b>; kein Staat soll Europa beherrschen</td></tr></table>

<h4>Welche Ideen der Revolution waren den reaktionären Monarchen besonders verhasst?</h4>
<p><b>Volkssouveränität</b> und <b>Republik</b> (bedrohen die Herrschaft der Fürsten), <b>Nationalismus</b> (bedroht Vielvölkerstaaten wie Österreich), <b>Gleichheit</b> (gegen Adelsvorrechte), <b>Freiheit / Menschenrechte</b> und die Forderung nach einer <b>Verfassung</b>.</p>

</ul>

body:`
<h3 data-s="Drei Begriffe">1. Die drei Begriffe</h3>
<div class="flow">
<div class="box"><b class="t">Restauration</b>Die Großmächte stellen die <b>Grenzen der Zeit vor der Französischen Revolution</b> wieder her und versuchen, die <b><mark>Ideen der Revolution zu unterdrücken</mark></b>.</div>
<div class="box"><b class="t">Biedermeier</b>Das bürgerliche Leben spielt sich in den <b><mark>eigenen vier Wände</mark>n</b> ab; man legt Wert auf ein <b>schönes Eigenheim</b>. Eigene Kunst, Kultur und Stilepoche 1815–1848 (<b>Biedermeier-Möbel und -Häuser</b>).</div>
<div class="box"><b class="t">Vormärz</b>Bezeichnung für die Zeit <b>vor dem März 1848</b>. Die Ausrufung der <b>II. Französischen Republik</b> in der <b><mark>Februarrevolution 1848</mark></b> löst im März <b>bürgerliche und nationale Revolutionen in ganz Europa</b> aus.</div>
</div>
<h3 data-s="Karlsbader Beschlüsse">2. Die Karlsbader Beschlüsse (1819)</h3>
<ul>
<li><b>Auslöser:</b> die <b>Ermordung</b> des russischen Generalkonsuls <b>August von Kotzebue</b> <span class="zi">(auch bekannter Schriftsteller)</span> durch einen deutsch-nationalen <b><mark>Burschenschafter</mark></b> sowie die antijüdischen <b><mark>Hep-Hep-Unruhen</mark></b>.</li>
<li>Beschlossen vom <b>Deutschen Bund</b> (unter Metternichs Einfluss).</li>
<li><b>Maßnahmen:</b>
<ul><li>Verbot der öffentlichen schriftlichen <b>Meinungsfreiheit</b></li>
<li>Verbot der <b>Burschenschaften</b> (deutsch-national gesinnte Studentenverbindungen)</li>
<li><b>Überwachung der Universitäten</b></li>
<li>Schließung der Turnplätze: <b>Turnsperre 1820–1842</b> („Turnvater Jahn“ war deutscher Nationalist)</li>
<li><b>Zensur</b> der Presse</li>
<li>Entlassung und <b>Berufsverbot</b> für liberal und national gesinnte Professoren</li></ul></li>
<li>Folge: In Österreich und Deutschland entstehen regelrechte <b><mark>Polizeistaaten</mark></b> mit <b>Zensur</b> und <b><mark>Spitzelwesen</mark></b> (Spitzel lesen die Post mit und belauschen die Menschen).</li>
</ul>
<h3 data-s="Karikatur">3. Karikatur „Der Denker-Club“ (1819)</h3>
<p><b>Text:</b> „Wichtige Frage, welche in heutiger Sitzung bedacht wird: Wie lange möchte uns das Denken noch erlaubt bleiben?“</p>
<table><tr><th>Schritt</th><th>Analyse</th></tr>
<tr><td>Beschreibung</td><td>Männer sitzen um einen Tisch. Manche tragen <b>Maulkörbe</b>, andere haben die Münder verschlossen. An der Wand hängen <b>Regeln</b>, die das Denken und Sprechen einschränken. Die Männer wirken nachdenklich, manche verzweifelt. Sie dürfen nicht reden, nur denken.</td></tr>
<tr><td>Aussage</td><td>Die Menschen durften im Vormärz <b>nicht frei denken und ihre Meinung äußern</b>. Durch die Karlsbader Beschlüsse 1819 wurden Meinungs- und Pressefreiheit stark eingeschränkt. Die Maulkörbe symbolisieren <b><mark>Zensur und Unterdrückung</mark></b>.</td></tr>
<tr><td>Intention</td><td>Der Zeichner kritisiert die strengen Regeln und die Unterdrückung der Meinungsfreiheit. Er macht sich darüber lustig, dass man nicht einmal frei diskutieren kann, und will auf die fehlenden Freiheiten aufmerksam machen.</td></tr></table>
<h3 data-s="Unterdrückte Rechte">4. Unterdrückte Menschenrechte und Freiheiten im Vormärz</h3>
<p><b>Meinungsfreiheit, Pressefreiheit, Redefreiheit, Versammlungsfreiheit, Vereinigungsfreiheit, Wissenschafts- und Lehrfreiheit, politische Mitbestimmung.</b></p>
<p>Die politische Strömung, die sich für diese Werte einsetzt, heißt <b>Liberalismus</b> (→ Tab „Liberalismus & Nationalismus“). Ein weiteres unterdrücktes Erbe der Revolution war der <b>Nationalismus</b>.</p>

<h3 data-s="Liberalismus">A. Liberalismus</h3>
<div class="card"><b>Definition:</b> Liberalismus von lat. <i>liber</i> = frei bzw. <i>liberalis</i> = die Freiheit betreffend.
<ul><li><b><mark>4 Grundpfeiler:</mark></b> Recht auf <b>Selbstbestimmung</b> und <b>politische Mitbestimmung</b>; <b>Beschränkung der politischen Macht</b>; <b>Freiheit gegenüber dem Staat</b>; <b>Selbstregulierung der Wirtschaft</b>.</li>
<li><b>Entwicklung:</b> Aufbegehren gegen den <b>Absolutismus</b> und den <b>Ständestaat</b>.</li>
<li><b>Begründer:</b> <b>Adam Smith</b> (Wirtschaftsliberalismus), <b>John Locke</b> (klassischer Liberalismus).</li>
<li><b>Formen:</b> klassischer, wirtschaftlicher, politischer, sozialer Liberalismus, Neoliberalismus.</li>
<li>In Deutschland durch die <b>FDP</b> vertreten. Österreich: <span class="zi"><b>NEOS</b>; früher das Liberale Forum (LIF). Liberale Ideen gibt es auch in anderen Parteien.</span></li></ul></div>
<p>Die Liberalen forderten eine <b>Verfassung</b> (Staatsgrundgesetz, an das sich selbst der König/Kaiser halten muss), in der die Freiheitsrechte festgeschrieben sind.</p>
<h3 data-s="Heute vs. 19. Jh.">A1. Liberalismus heute und im 19. Jahrhundert</h3>
<div class="zusatz"><table><tr><th>Heute meist gemeint</th><th>Im 19. Jahrhundert</th></tr>
<tr><td>wirtschaftsliberal (wenig Staat, freier Markt, niedrige Steuern) und gesellschaftlich offen (individuelle Freiheit, Toleranz)</td><td>revolutionäre Bewegung des Bürgertums gegen Absolutismus und Adelsvorrechte: Verfassung, Grundrechte (Presse-, Meinungs-, Versammlungsfreiheit), Parlament, Rechtsstaat, Gewerbefreiheit</td></tr></table></div>
<h4>Welche Forderungen passen zum Liberalismus?</h4>
<div class="zusatz"><table><tr><th>Passt (liberal)</th><th>Passt nicht (streichen)</th></tr>
<tr><td>Freier Wettbewerb · Freier Markt · Schlanker Staat · Privatisierung verstaatlichter Unternehmen · Staat schafft Rahmenbedingungen für freie Wirtschaft (Rechtsstaat)</td><td>Verstaatlichung der Wirtschaft · Starker Sozialstaat · Gratis Bildung ohne Studiengebühren · Law & Order mit möglichst vielen Kompetenzen für die Polizei</td></tr></table>
<span class="small">Hinweis: Im Arbeitsblatt steht „Schanker Staat“, gemeint ist „schlanker Staat“.</span></div>
<h3 data-s="Adam Smith">A2. Wirtschaftsliberalismus und Adam Smith</h3>
<ul>
<li><b>Wirtschaftsliberalismus</b> = <b>freie Marktwirtschaft</b>: ein sich selbst regulierendes System, gesteuert durch die <b><mark>„unsichtbare Hand“</mark></b> des Marktes; freie wirtschaftliche Handlung.</li>
<li><b>Smiths Theorie der „unsichtbaren Hand“:</b> Der einzelne Mensch trägt, indem er seine <b>eigennützigen Ziele</b> verfolgt, zum <b>Wohl der Gesellschaft</b> bei. <b>Staatliche Eingriffe</b> in die Wirtschaft werden abgelehnt → <b><mark>„Nachtwächterstaat“</mark></b> (der Staat sorgt nur für Sicherheit und Ordnung).</li>
<li>In der Französischen Revolution umgesetzt: Abschaffung der Zünfte, Gewerbefreiheit.</li>
</ul>
<h3 data-s="Nationalismus">B. Nationalismus</h3>
<div class="card"><b>Definition:</b> „Politische Strömung, deren Ziel es ist, dass <b><mark>alle Menschen (Angehörigen) einer Nation in einem Staat leben</mark></b>.“<br><span class="small">Falsche Lösungen im Arbeitsblatt: „… alle der Nation nicht Angehörigen verjagt werden“ und „… alle Nationen gleichgestellt werden“.</span></div>
<p>Ein weiteres politisches Vermächtnis der Französischen Revolution, das im Vormärz unterdrückt wurde.</p>
<h3 data-s="Entstehung">B1. Entstehung des Nationalismus</h3>
<div class="flow">
<div class="box"><b class="t">Vor der Revolution</b><b>Loyalität</b> zum Herrscher bzw. <b>Standeszugehörigkeit</b> wichtig; <b>ethnische</b> Zugehörigkeit wenig bedeutend. 17./18. Jh.: Fürsten halten <b>internationale Söldnerheere</b>.</div>
<div class="arrow">→</div>
<div class="box"><b class="t">Französische Revolution</b><b>Revolutionsarmee = nationale Volksarmee</b>: Großteil der wehrfähigen Männer eingezogen (<b><mark>levée en masse = Massenrekrutierung</mark></b>). Leute aus verschiedenen Regionen und <b>sozialen</b> Schichten dienen gemeinsam → <b><mark>„Wir-Gefühl“</mark></b>.</div>
<div class="arrow">→</div>
<div class="box"><b class="t">Folge</b>Wegen Zahl und Motivation ist die Volksarmee (Milizheer) den Söldnerarmeen <b>überlegen</b> → Modell wird überall nachgeahmt → in ganz Europa entsteht ein <b>„Wir“ und „die Anderen“-Gefühl</b>.</div>
</div>
<p>Dazu kam der Widerstand der Völker gegen <b>Napoleons</b> Herrschaft (siehe Tab Napoleon).</p>
<div class="zusatz"><b>Woher kommt das Wort „Krawatte“?</b> Im 17. Jh. (Dreißigjähriger Krieg) dienten <b>kroatische Söldner</b> im französischen Heer. Sie trugen auffällige Halstücher. Die Franzosen nannten diese Mode „à la croate“ → <b>cravate</b> → Krawatte. Das zeigt: Söldnerheere waren international, die Herkunft der Soldaten spielte keine Rolle.</div>
<h3 data-s="Europa 1815">B2. Europa 1815 und Unterdrückung</h3>
<h4>Kartenanalyse: Europa 1815</h4>
<ul>
<li><b>Nationen mit eigenem Staat (1815):</b> Frankreich, Spanien, Portugal, Großbritannien, Schweiz <span class="zi">auch z.B. Niederlande, Schweden, Dänemark</span></li>
<li><b>Nationen ohne eigenen Staat:</b> <span class="zi">Deutsche und Italiener (in viele Staaten zersplittert); Polen (aufgeteilt); Tschechen, Slowaken, Ungarn, Kroaten, Slowenen u.a. im Kaisertum Österreich; Griechen, Serben, Bulgaren im Osmanischen Reich</span></li>
</ul>
<h4>Warum wurde der Nationalismus im Vormärz unterdrückt?</h4>
<table><tr><th>Österreich</th><th>Deutschland</th></tr>
<tr><td>Bedrohte die <b>Einheit Österreichs</b>: Österreich war ein <b><mark>Vielvölkerstaat</mark></b>; wenn jede Nation einen eigenen Staat will, zerfällt es.</td><td>Bedrohte die <b>Unabhängigkeit der einzelnen deutschen Staaten</b>: Ein deutscher Nationalstaat hätte die Macht der vielen Fürsten beendet.</td></tr></table>
<h3 data-s="Nation & Symbole">B3. Nation, Patriotismus, Symbole</h3>
<h4>Was ist eine Nation?</h4>
<p>Merkmale (Gemeinsamkeiten): <b>Sprache/Kultur</b>, <b>Abstammung/Herkunft</b>, <b>Ideologie</b> (z.B. USA: gemeinsame Werte). → <b><mark>Die Nation entsteht in den Köpfen.</mark></b></p>
<h4>Nationalismus vs. Patriotismus</h4>
<ul><li><b>Nationalismus</b> bezeichnet heute meist ein auf <b>Herabwürdigung des Anderen</b> beruhendes Überlegenheitsgefühl.</li>
<li><b>Patriotismus</b> ist als <b>„Vaterlandsliebe“</b> (noch) positiv besetzt.</li></ul>
<h4>Nationale Symbole</h4>
<p><b>Fahne, Hymne, Nationalfeiertag, Nationalhelden.</b> Beispiel Frankreich: Trikolore, Marseillaise, 14. Juli, Jeanne d'Arc / Napoleon <span class="zi">Nationalhelden</span>. Beispiel Österreich: <span class="zi">Rot-Weiß-Rot, Bundeshymne, 26. Oktober, Andreas Hofer</span>.</p>
<h4>Flaggen und ihre Herkunft</h4>
<ul>
<li>Bereits im <b>17. Jh.</b> verwendeten <b>holländische Schiffe</b> eine gemeinsame Flagge, um sich auf See zu erkennen → <b>Vorbild</b>.</li>
<li>Die Idee gefällt <b>Zar Peter dem Großen</b>: Er reist Anfang des 18. Jh. <b>inkognito nach Holland</b>, um das Seewesen zu studieren, und erkennt: Die russische Flotte braucht eine Flagge (<span class="zi">Weiß-Blau-Rot, die holländischen Farben umgestellt</span>).</li>
<li>Viele <b>slawische Nationen</b> orientierten sich an der Fahne <b>Russlands</b>, der führenden slawischen Nation (<b>„Panslawismus“</b>): <b>Tschechen, Serben, Kroaten, Slowaken, Slowenen</b>.</li>
</ul>
`,

{op:"erklären",q:"Erkläre Adam Smiths Theorie der „unsichtbaren Hand“.",a:"Wenn jeder Mensch seine eigenen (eigennützigen) Ziele verfolgt, entsteht über Angebot und Nachfrage automatisch Wohlstand für die Gesellschaft, wie von einer unsichtbaren Hand gelenkt. Der Staat soll sich aus der Wirtschaft heraushalten (Nachtwächterstaat)."},
{op:"erklären",q:"Erkläre, wie der Nationalismus entstand.",a:"Vor der Revolution zählten Loyalität zum Herrscher und Stand, Heere bestanden aus internationalen Söldnern. Die Französische Revolution schuf mit der levée en masse eine nationale Volksarmee; Männer aus allen Regionen und Schichten kämpften gemeinsam → Wir-Gefühl. Diese Armee war überlegen und wurde überall kopiert; dazu kam der Widerstand gegen Napoleon. So entstand in ganz Europa das Gefühl „wir“ und „die Anderen“."},
{op:"erklären",q:"Erkläre, warum der Nationalismus in Österreich und Deutschland unterdrückt wurde.",a:"Österreich war ein Vielvölkerstaat; der Nationalismus bedrohte seine Einheit. In Deutschland hätte ein Nationalstaat die Unabhängigkeit der vielen Einzelstaaten und die Macht ihrer Fürsten beendet."},
{op:"vergleichen",q:"Vergleiche Nationalismus und Patriotismus.",a:"Nationalismus: heute meist Überlegenheitsgefühl, das andere herabwürdigt. Patriotismus: Vaterlandsliebe, positiv besetzt, ohne Abwertung anderer."},
{op:"vergleichen",q:"Vergleiche den Liberalismus im 19. Jahrhundert mit dem heutigen Verständnis.",a:"19. Jh.: Bewegung des Bürgertums gegen Absolutismus, für Verfassung, Grundrechte und Mitbestimmung. Heute: vor allem freier Markt, wenig Staat und individuelle Freiheit (in Österreich z.B. NEOS)."},
{op:"beurteilen",q:"Beurteile, ob die Nation „in den Köpfen“ entsteht.",a:"Ja, weitgehend: Merkmale wie Sprache, Abstammung oder Ideologie sind nicht bei allen Nationen gleich (USA: gemeinsame Werte statt Abstammung). Entscheidend ist, dass sich Menschen zusammengehörig fühlen; Symbole wie Fahne und Hymne stärken dieses Gefühl."}],

title:"Industrielle Revolution: Folgen und soziale Frage",
ueberblick:"Maschinen ersetzen Handwerker, gleichzeitig wächst die Bevölkerung stark. Es gibt mehr Arbeiter und weniger Arbeitsplätze, die Löhne sinken: Arbeiterelend. Es entstehen Großbürgertum und Proletariat, Städte wachsen, Handel und Nationalismus nehmen zu, und beide Gruppen fordern politische Mitbestimmung.",
kern:"Die Industrielle Revolution verändert Wirtschaft und Gesellschaft: Sie bringt Wohlstand für das Großbürgertum, aber Elend für die Arbeiter (Proletariat), die Mitte des 19. Jh. noch fast keine Rechte haben.",
body:`
<div class="zusatz">Die Industrielle Revolution begann Mitte des 18. Jh. in <b>England</b> (Dampfmaschine, verbessert von James Watt 1769; Textilmaschinen) und erreichte Österreich und Deutschland im 19. Jh. Sie lief parallel zu Revolution, Napoleon und Vormärz.</div>
<h3 data-s="Arbeiterelend">1. Ursachen des Arbeiterelends</h3>
<div class="flow">
<div class="box"><b class="t">Bevölkerungswachstum</b>→ mehr Arbeiter</div>
<div class="box"><b class="t">Maschinen</b>(statt Handwerker) → weniger Arbeitsplätze</div>
<div class="arrow">→</div>
<div class="box"><b class="t">Löhne sinken</b>viele Arbeiter, wenig Arbeit</div>
<div class="arrow">→</div>
<div class="box"><b class="t"><mark>ARBEITERELEND</mark></b><span class="zi">„soziale Frage“</span></div>
</div>
<h3 data-s="Fehlende Rechte">2. Arbeitnehmerrechte, die Mitte des 19. Jh. noch nicht erkämpft waren</h3>
<ul>
<li><b>Geregelte Maximalarbeitszeiten</b> (in Fabriken im 19. Jh. verbreitet: <b><mark>16-Stunden-Tag</mark></b>, Nachtarbeit, Sonntagsarbeit)</li>
<li><b>Mindestlöhne</b> (Kollektivvertrag)</li>
<li><b>Verbot von Kinderarbeit</b></li>
<li><b>Urlaub</b></li>
<li><b>Unfallversicherung</b>, <b>Krankenversicherung</b>, <b>Arbeitslosenversicherung</b></li>
<li><b>Mitversicherung von Familienangehörigen</b></li>
<li><b>Personalvertretung</b> (Betriebsrat)</li>
</ul>
<h3 data-s="Folgen">3. Folgen der Industriellen Revolution</h3>
<table><tr><th>Bereich</th><th>Folge</th></tr>
<tr><td>Gesellschaft</td><td>Neue Schichten: <b>Großbürgertum</b> (Fabrikbesitzer) und <b><mark>Proletariat</mark></b> (Fabrikarbeiter); beide <b>fordern politische Mitbestimmung</b></td></tr>
<tr><td>Bevölkerung</td><td><b>Bevölkerungsexplosion</b>; <b>Städte wachsen</b> (<b><mark>Landflucht</mark></b>)</td></tr>
<tr><td>Wirtschaft</td><td><b>Handel +</b>; <b>Nation = Wirtschaftsraum</b> (einheitlicher Markt, Zölle) → <b>Nationalismus +</b></td></tr>
<tr><td>Welt</td><td><b>Europäisierung der Welt</b> → <b><mark>Imperialismus</mark></b> (Suche nach Rohstoffen und Absatzmärkten)</td></tr></table>
<p><b>Verbindung zu den anderen Themen:</b> Der <b>Wirtschaftsliberalismus</b> (freier Markt, kein Staatseingriff) verschärfte das Elend der Arbeiter (vgl. Streikverbot in der Französischen Revolution). Das Großbürgertum stärkte den <b>Liberalismus</b>, die Idee der Nation als Wirtschaftsraum den <b>Nationalismus</b>.</p>
`,
